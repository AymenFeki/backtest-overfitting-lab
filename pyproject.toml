[project]
name = "overfitlab"
version = "0.1.0"
description = "A controlled experiment on false discoveries in strategy backtesting"
readme = "README.md"
authors = [
    { name = "Aymen Feki", email = "Feki.Aymen@campus.lmu.de" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
